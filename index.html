<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DMG Software Suite</title>
  <script>
    window.__dmgBoot = { start: Date.now(), rendered: false };
    window.addEventListener('error', function (ev) {
      if (!window.__dmgBoot) return;
      window.__dmgBoot.scriptError = ev && ev.message ? ev.message : 'Script error';
    }, true);
    window.addEventListener('unhandledrejection', function (ev) {
      if (!window.__dmgBoot) return;
      window.__dmgBoot.scriptError = String(ev.reason || ev);
    });
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<div id="root">
  <div id="boot-loading" class="boot-shell" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-title">DMG Software Suite</div>
      <p class="boot-msg">Loading application<span class="boot-dots"></span></p>
      <p class="boot-sub">First load may take a moment. If this screen stays more than a minute, refresh or try another network.</p>
    </div>
  </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
